<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="favicon/weather-favicon.png"
      type="image/x-icon"
    />
    <title>Weather forecast</title>
    <style>
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      border: 0 !important;
      padding: 0 !important;
      white-space: nowrap !important;
      clip-path: inset(100%) !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
    }
    </style>
    <script type="module" crossorigin src="/Weather-forecast/assets/index-BcxffUcf.js"></script>
    <link rel="stylesheet" crossorigin href="/Weather-forecast/assets/index-CUKP0hRc.css">
  </head>

  <body>
    <header class="header container" style="visibility:hidden">
      <button
        class="header__burger-button"
        aria-label="Открыть историю запросов"
      >
        <div class="header__burger-button-wrapper">
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
        </div>
      </button>

      <form class="header__form" autocomplete="off">
        <label for="city-input" class="visually-hidden"
          >Введите название города</label
        >
        <input
          id="city-input"
          class="header__input"
          type="text"
          placeholder="Введите название города"
        />
        <button
          class="header__search-button"
          aria-label="Начать поиск"
        ></button>
      </form>
    </header>

    <main class="main container">
      <h1 class="visually-hidden">Прогноз погоды</h1>
      <section class="current">
        <h2 class="visually-hidden">Текущая погода</h2>
      </section>

      <section class="detailed">
        <h2 class="visually-hidden">Подробный прогноз</h2>
        
        <div class="one-day">
          <h3 class="visually-hidden">Прогноз каждые 3 часа</h3>
          <div class="swiper-container">
            <div class="swiper-wrapper"></div>
          </div>
        </div>

        <div class="fiveday">
          <h3 class="visually-hidden">Прогноз на 5 дней</h3>
          <div class="weather-grid">
            <div class="weather-grid__wrapper"></div>
          </div>
        </div>
      </section>
    </main>
.
    <footer class="footer container" style="visibility:hidden">
      <div class="footer__author">
        Разработал:
        <a
          href="https://t.me/ShvedovILya"
          target="_blank"
          rel="noopener noreferrer"
          class="footer__author-link"
          >@ShvedovILya</a
        >
      </div>
    </footer>

    <!-- История -->
    <div class="history-popup" style="visibility:hidden">
      <h2 class="visually-hidden">История запросов</h2>
      <div class="history-popup__header">
        <button
          class="history-popup__close-button"
          aria-label="Закрыть историю запросов"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <line
              x1="1"
              y1="1"
              x2="15"
              y2="15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <line
              x1="15"
              y1="1"
              x2="1"
              y2="15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          class="history-popup__clean-button"
          aria-label="Очистить историю запросов"
        >
          Очистить
        </button>
      </div>

      <div class="history-popup__content container"></div>
    </div>

    <!-- Анимационный слой -->
    <div class="preloader" >
        <div class="preloader__sun"></div>
        <div class="preloader__moon"></div>
      </div>
    </div>
  </body>
</html>
