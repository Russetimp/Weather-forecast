<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/public/favicon/weather-favicon.png"
      type="image/x-icon"
    />
    <title>Weather forecast</title>
  </head>

  <body>
    <header class="header container">
      <button
        class="header__burger-button"
        aria-label="Открыть историю запросов"
      >
        <div class="header__burger-button-wrapper">
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
        </div>
      </button>

      <form class="header__form" autocomplete="off">
        <label for="city-input" class="visually-hidden"
          >Введите название города</label
        >
        <input
          id="city-input"
          class="header__input"
          type="text"
          placeholder="Введите название города"
        />
        <button
          class="header__search-button"
          aria-label="Начать поиск"
        ></button>
      </form>
    </header>

    <main class="main container">
      <h1 class="visually-hidden">Прогноз погоды</h1>
      <section class="current">
        <h2 class="visually-hidden">Текущая погода</h2>
      </section>
      <section class="detailed">
        <h2 class="visually-hidden">Подробный прогноз</h2>
        <div class="one-day">
          <h3 class="visually-hidden">Прогноз каждые 3 часа</h3>
          <div class="swiper-container">
            <div class="swiper-wrapper"></div>
          </div>
          <div
            class="swiper-button-prev custom-prev"
            aria-label="Предыдущее время погоды"
          >
            <svg
              class="arrow-left"
              aria-hidden="true"
              viewBox="0 0 15 27"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                class="arrow-left_circle"
                cx="7.5"
                cy="13.5"
                r="5.625"
                fill="#E0E0E0"
              />
              <g
                transform="translate(7.5 13.5) scale(0.6667) translate(-2.5 -4.5)"
              >
                <path
                  d="M1.46,6.75 L1.25,6.55 L3.33,4.5 L1.25,2.45 L1.46,2.25 L3.75,4.5 L1.46,6.75 Z"
                  fill="none"
                  stroke="#3F51B5"
                  stroke-width="0.2"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
          <div
            class="swiper-button-next custom-next"
            aria-label="Следующее время погоды"
          >
            <svg
              class="arrow-right"
              aria-hidden="true"
              viewBox="0 0 15 27"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                class="arrow-right__circle"
                cx="7.5"
                cy="13.5"
                r="5.625"
                fill="#E0E0E0"
              />
              <g
                transform="translate(7.5 13.5) scale(0.6667) translate(-2.5 -4.5)"
              >
                <path
                  d="M1.46,6.75 L1.25,6.55 L3.33,4.5 L1.25,2.45 L1.46,2.25 L3.75,4.5 L1.46,6.75 Z"
                  fill="none"
                  stroke="#3F51B5"
                  stroke-width="0.2"
                  stroke-linejoin="round"
                />
              </g>
            </svg>
          </div>
        </div>

        <div class="fiveday">
          <h3 class="visually-hidden">Прогноз на 5 дней</h3>
          <div class="weather-grid">
            <div class="weather-grid__wrapper"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer container">
      <div class="footer__author">
        Разработал:
        <a
          href="https://t.me/ShvedovILya"
          target="_blank"
          rel="noopener noreferrer"
          class="footer__author-link"
          >@ShvedovILya</a
        >
      </div>
    </footer>

    <!-- История -->
    <div class="history-popup">
      <h2 class="visually-hidden">История запросов</h2>
      <div class="history-popup__header">
        <button
          class="history-popup__close-button"
          aria-label="Закрыть историю запросов"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <line
              x1="1"
              y1="1"
              x2="15"
              y2="15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <line
              x1="15"
              y1="1"
              x2="1"
              y2="15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          class="history-popup__clean-button"
          aria-label="Очистить историю запросов"
        >
          Очистить
        </button>
      </div>

      <div class="history-popup__content container"></div>
    </div>

    <script src="/src/js/main.js" type="module"></script>
  </body>
</html>
